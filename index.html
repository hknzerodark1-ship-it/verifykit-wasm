<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VerifyKit — Signed Attestation Engine</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ffcc;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            border: 1px solid #00ffcc;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        input, textarea, button {
            background: #1a1a1a;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 10px;
            font-family: monospace;
            width: 100%;
            margin: 5px 0;
        }
        button {
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #00ffcc22;
        }
        .output {
            background: #0a1a0a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            word-break: break-all;
            font-size: 12px;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
        }
        .valid { background: #00aa4422; color: #00ff88; }
        .invalid { background: #ff003322; color: #ff6666; }
        hr { border-color: #00ffcc33; }
    </style>
</head>
<body>
<h1>🔐 VerifyKit — Signed Attestation Engine</h1>
<p>Cryptographic proof with Ed25519 signatures + BLAKE3 hashing</p>

<div class="card">
    <h2>1. Generate Keypair</h2>
    <button id="genKeyBtn">Generate Ed25519 Keypair</button>
    <div class="output" id="keypairOutput">Click to generate</div>
</div>

<div class="card">
    <h2>2. Sign a Message</h2>
    <textarea id="messageInput" rows="3" placeholder="Enter message to sign...">$350,019.07 Continental Root Verified</textarea>
    <input type="text" id="privateKeyInput" placeholder="Private key (hex)">
    <button id="signBtn">Sign Message</button>
    <div class="output" id="signatureOutput"></div>
</div>

<div class="card">
    <h2>3. Verify Signature</h2>
    <input type="text" id="verifyPublicKeyInput" placeholder="Public key (hex)">
    <input type="text" id="verifySignatureInput" placeholder="Signature (hex)">
    <button id="verifyBtn">Verify Signature</button>
    <div class="status" id="verifyStatus"></div>
</div>

<script type="module">
    import init, { generate_keypair, sign_message, verify_signature, hash_message, create_attestation } from './pkg/verifykit_wasm.js';

    let wasmReady = false;

    async function loadWasm() {
        await init();
        wasmReady = true;
        document.getElementById('keypairOutput').innerHTML = '✅ WASM loaded. Ready to generate keys.';
    }
    loadWasm();

    document.getElementById('genKeyBtn').onclick = () => {
        if (!wasmReady) { alert('WASM not ready'); return; }
        const keypair = JSON.parse(generate_keypair());
        document.getElementById('keypairOutput').innerHTML = `
            <b>Private Key (keep secret):</b><br>${keypair.private_key}<br><br>
            <b>Public Key (share):</b><br>${keypair.public_key}
        `;
        document.getElementById('privateKeyInput').value = keypair.private_key;
        document.getElementById('verifyPublicKeyInput').value = keypair.public_key;
    };

    document.getElementById('signBtn').onclick = () => {
        if (!wasmReady) { alert('WASM not ready'); return; }
        const message = document.getElementById('messageInput').value;
        const privateKey = document.getElementById('privateKeyInput').value;
        if (!privateKey) { alert('Generate or enter a private key first'); return; }
        
        const signature = sign_message(privateKey, message);
        const hash = hash_message(message);
        
        document.getElementById('signatureOutput').innerHTML = `
            <b>Message:</b> ${message}<br><br>
            <b>Hash (BLAKE3):</b><br>${hash}<br><br>
            <b>Signature (Ed25519):</b><br>${signature}
        `;
        document.getElementById('verifySignatureInput').value = signature;
    };

    document.getElementById('verifyBtn').onclick = () => {
        if (!wasmReady) { alert('WASM not ready'); return; }
        const publicKey = document.getElementById('verifyPublicKeyInput').value;
        const signature = document.getElementById('verifySignatureInput').value;
        const message = document.getElementById('messageInput').value;
        
        const isValid = verify_signature(publicKey, message, signature);
        const statusDiv = document.getElementById('verifyStatus');
        
        if (isValid) {
            statusDiv.innerHTML = '✅ SIGNATURE VALID — Message integrity confirmed';
            statusDiv.className = 'status valid';
        } else {
            statusDiv.innerHTML = '❌ SIGNATURE INVALID — Tampering detected';
            statusDiv.className = 'status invalid';
        }
    };
</script>
</body>
</html>
