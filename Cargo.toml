[package]
name = "verifykit-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
serde_json = "1.0"
hex = "0.4"
blake3 = "1.5"

[package.metadata.wasm-pack]
wasm-opt = false
